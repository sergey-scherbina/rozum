<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>rozum</title>
  <style>
    /* Theme tokens. Light values are the defaults; the prefers-color-scheme
       media query overrides them for dark mode. */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #111;
      --muted: #555;
      --muted-2: #666;
      --muted-3: #999;
      --border: #ccc;
      --chip-bg: #fafafa;
      --chip-border: #ddd;
      --accent: #00a;
      --accent-fg: #ffffff;
      --injected: #999;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171a;
        --fg: #e6e6e6;
        --muted: #aab;
        --muted-2: #99a;
        --muted-3: #778;
        --border: #2c3036;
        --chip-bg: #1d2126;
        --chip-border: #2c3036;
        --accent: #6cf;
        --accent-fg: #0a0c10;
        --injected: #7a7f86;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: monospace;
      padding: 12px;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--fg);
    }
    #header {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 6px;
      font-size: 12px;
      color: var(--muted);
      min-height: 18px;
    }
    #header .chip {
      border: 1px solid var(--chip-border);
      border-radius: 10px;
      padding: 1px 8px;
      background: var(--chip-bg);
    }
    #log {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      padding: 8px;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      /* Newest message at the visual top, oldest at the bottom. Append at
         end of DOM still pushes new content to the top visually; browsers
         keep scrollTop=0 ("at newest") stable across appends. */
      display: flex;
      flex-direction: column-reverse;
    }
    #presence {
      font-size: 12px;
      color: var(--muted-2);
      min-height: 16px;
      padding: 0 2px;
    }
    #presence:empty { display: none; }
    #presence .glyph {
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", monospace;
      margin-right: 2px;
    }
    .system {
      color: var(--muted-3);
      font-style: italic;
    }
    .msg-collapsible.collapsed > .body {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .expand {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      padding: 0;
      margin-top: 2px;
    }
    #newpill {
      align-self: center;
      display: none;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 14px;
      padding: 3px 12px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      margin: 2px 0;
    }
    #controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }
    #msg {
      flex: 1;
      min-width: 0;
      max-height: 30vh;
      resize: none;
      overflow-y: auto;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.4;
      font-family: inherit;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    #controls input, #controls textarea, #controls button {
      font: inherit;
      font-size: 16px;
      padding: 8px 10px;
      min-height: 40px;
    }
    #controls button {
      flex-shrink: 0;
      background: var(--accent);
      color: var(--accent-fg);
      border: 1px solid var(--accent);
      border-radius: 4px;
      cursor: pointer;
    }
    .injected { color: var(--injected); }
    .me { color: var(--accent); }
    @media (max-width: 480px) {
      body { padding: 8px; gap: 6px; }
      #controls { gap: 4px; }
      #msg { flex: 1 1 auto; max-height: 20vh; }
    }
  </style>
</head>
<body>
<div id="header"></div>
<div id="controls">
  <textarea id="msg" rows="1" placeholder="message..."></textarea>
  <button onclick="send()">Send</button>
</div>
<div id="presence"></div>
<button id="newpill" type="button">↑ 0 new</button>
<div id="log"></div>
<script>
const log = document.getElementById('log');
const header = document.getElementById('header');
const presence = document.getElementById('presence');
const ws = new WebSocket(`ws://${location.host}/ws`);
// Set by the server's hello envelope right after WS connect; used as the
// alias for every outgoing message.
let myName = 'web';

// participant_id -> display_name
const participants = new Map();
// participant_id -> { kind: 'typing'|'waiting' }
const presenceState = new Map();
// `${seq}_${ts}` -> true; deduplicates msgs that appear in both history and
// broadcast. (seq, ts) is used instead of seq alone so that persisted history
// from previous rozum sessions — where seq numbering restarts — does not
// collide with the current session.
const seenIds = new Set();
// lowest seq currently rendered in #log; used to lazy-fetch older history
let minSeq = Infinity;
let topFetchInFlight = false;

const GLYPH = { typing: '✏️', waiting: '⏳' };
const VERB  = { typing: 'is typing…', waiting: 'is waiting' };

ws.onopen = () => append('--- connected ---', 'system');
ws.onclose = () => append('--- disconnected ---', 'system');
ws.onmessage = e => {
  const env = JSON.parse(e.data);
  switch (env.kind) {
    case 'hello':    if (env.name) myName = env.name; break;
    case 'msg':      onMsg(env); break;
    case 'presence': onPresence(env); break;
    case 'joined':   onJoined(env); break;
    case 'left':     onLeft(env); break;
    case 'history':  onHistory(env); break;
  }
};

function idOf(m) {
  return `${m.seq ?? 0}_${m.ts ?? 0}`;
}

function onMsg(env) {
  const id = idOf(env);
  if (seenIds.has(id)) return;
  seenIds.add(id);
  if (typeof env.seq === 'number' && env.seq < minSeq) minSeq = env.seq;
  const cls = env.injected ? 'injected' : '';
  append(`[${env.speaker}]: ${env.content}`, cls);
}

function onHistory(env) {
  const msgs = env.messages || [];
  for (const m of msgs) {
    const id = idOf(m);
    if (seenIds.has(id)) continue;
    seenIds.add(id);
    if (typeof m.seq === 'number' && m.seq < minSeq) minSeq = m.seq;
    const cls = m.injected ? 'injected' : '';
    append(`[${m.speaker}]: ${m.content}`, cls);
  }
}

async function fetchOlder() {
  if (topFetchInFlight || !Number.isFinite(minSeq) || minSeq <= 0) return;
  topFetchInFlight = true;
  try {
    const from = Math.max(0, minSeq - 200);
    const resp = await fetch(`/transcript?from_seq=${from}&limit=200`);
    if (!resp.ok) return;
    const data = await resp.json();
    const msgs = (data.messages || []).filter(m => !seenIds.has(idOf(m)) && m.seq < minSeq);
    if (msgs.length === 0) return;
    // Older messages go at the DOM start (= visual bottom in column-reverse).
    // The browser keeps the user's existing content where it is on screen;
    // they can continue scrolling down to reach the newly loaded older
    // entries.
    msgs.sort((a, b) => a.seq - b.seq);
    const frag = document.createDocumentFragment();
    for (const m of msgs) {
      seenIds.add(idOf(m));
      if (typeof m.seq === 'number' && m.seq < minSeq) minSeq = m.seq;
      frag.appendChild(makeMsgEl(`[${m.speaker}]: ${m.content}`, m.injected ? 'injected' : ''));
    }
    log.insertBefore(frag, log.firstChild);
  } finally {
    topFetchInFlight = false;
  }
}

function onPresence(env) {
  presenceState.clear();
  for (const e of (env.responding || [])) {
    presenceState.set(e.participant_id, { kind: 'typing', name: e.display_name });
  }
  for (const e of (env.polling || [])) {
    if (presenceState.has(e.participant_id)) continue;
    presenceState.set(e.participant_id, { kind: 'waiting', name: e.display_name });
  }
  renderPresence();
}

function onJoined(env) {
  if (!participants.has(env.participant_id)) {
    participants.set(env.participant_id, env.display_name);
    append(`--- ${env.display_name} joined ---`, 'system');
    renderHeader();
  }
}

function onLeft(env) {
  if (participants.has(env.participant_id)) {
    participants.delete(env.participant_id);
    presenceState.delete(env.participant_id);
    append(`--- ${env.display_name} left ---`, 'system');
    renderHeader();
    renderPresence();
  }
}

function renderHeader() {
  header.replaceChildren();
  for (const name of participants.values()) {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = name;
    header.appendChild(chip);
  }
}

function renderPresence() {
  presence.replaceChildren();
  let first = true;
  for (const [, s] of presenceState) {
    if (s.name === myName) continue;
    if (!first) presence.appendChild(document.createTextNode(' · '));
    const glyph = document.createElement('span');
    glyph.className = 'glyph';
    glyph.textContent = GLYPH[s.kind];
    presence.appendChild(glyph);
    presence.appendChild(document.createTextNode(`${s.name} ${VERB[s.kind]}`));
    first = false;
  }
}

const newpill = document.getElementById('newpill');
let unread = 0;

// With #log using flex-direction: column-reverse, the visual TOP of the log
// (newest message) is scrollTop === 0; scrolling DOWN moves toward older
// content. "atNewest" replaces the old "atBottom" for the same role: are we
// looking at the most recent message?
function atNewest() {
  return log.scrollTop <= 40;
}

function nearOldest() {
  return log.scrollTop + log.clientHeight >= log.scrollHeight - 60;
}

function setUnread(n) {
  unread = n;
  if (unread > 0 && !atNewest()) {
    newpill.firstChild.nodeValue = `↑ ${unread} new`;
    newpill.style.display = '';
  } else {
    newpill.style.display = 'none';
  }
}

log.addEventListener('scroll', () => {
  if (atNewest()) setUnread(0);
  log.dataset.stick = atNewest() ? 'true' : 'false';
  if (nearOldest()) fetchOlder();
});

newpill.addEventListener('click', () => {
  log.scrollTop = 0;
  setUnread(0);
});

function makeMsgEl(text, cls) {
  const el = document.createElement('div');
  if (cls) el.className = cls;
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  const lineCount = (text.match(/\n/g) || []).length + 1;
  const isLong = lineCount > 6 || text.length > 600;
  el.appendChild(body);
  if (isLong) {
    el.classList.add('msg-collapsible', 'collapsed');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'expand';
    btn.textContent = '[expand ▾]';
    btn.addEventListener('click', () => {
      const collapsed = el.classList.toggle('collapsed');
      btn.textContent = collapsed ? '[expand ▾]' : '[collapse ▴]';
    });
    el.appendChild(btn);
  }
  return el;
}

function append(text, cls) {
  const el = makeMsgEl(text, cls);
  const wasStick = atNewest();
  // With column-reverse, the last DOM child is the visual top. Browsers
  // preserve scrollTop=0 across appends when stuck to the top.
  log.appendChild(el);
  if (wasStick) {
    log.scrollTop = 0;
  } else {
    setUnread(unread + 1);
  }
}

const msgEl = document.getElementById('msg');

function autosize() {
  msgEl.style.height = 'auto';
  msgEl.style.height = msgEl.scrollHeight + 'px';
}

function send() {
  if (!msgEl.value.trim()) return;
  ws.send(JSON.stringify({ name: myName, content: msgEl.value.trim() }));
  append(`[${myName}]: ${msgEl.value.trim()}`, 'me');
  msgEl.value = '';
  msgEl.style.height = 'auto';
}

msgEl.addEventListener('input', autosize);
msgEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  } else if (e.key === 'Escape') {
    msgEl.value = '';
    msgEl.style.height = 'auto';
  }
});
</script>
</body>
</html>
