<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rozum meeting</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font: 14px/1.5 -apple-system, system-ui, sans-serif;
         background: #14161a; color: #e6e6e6; }
  header { padding: 8px 14px; background: #1b1e24; border-bottom: 1px solid #2a2e36;
           font-weight: 600; color: #9ad; display: flex; justify-content: space-between; }
  header .status { font-weight: 400; font-size: 12px; color: #788; }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg { margin: 0 0 8px; max-width: 900px; word-wrap: break-word; white-space: pre-wrap; }
  .msg .who { color: #7ab8ff; font-weight: 600; margin-right: 6px; }
  .msg.sys .who { color: #c98; }
  form { display: flex; gap: 8px; padding: 10px 14px; background: #1b1e24; border-top: 1px solid #2a2e36; }
  #m { flex: 1; padding: 9px 11px; border-radius: 8px; border: 1px solid #333a44;
       background: #0f1115; color: #e6e6e6; font: inherit; }
  button { padding: 9px 16px; border: 0; border-radius: 8px; background: #2f6feb; color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header><span id="room">rozum meeting</span><span class="status" id="status">connecting…</span></header>
  <div id="log"></div>
  <form id="f"><input id="m" placeholder="message…" autocomplete="off" autofocus /><button id="send">send</button></form>
<script>
const log = document.getElementById('log');
const statusEl = document.getElementById('status');
const seen = new Set();

function key(t) { return (t.date || '') + ':' + (t.n ?? ''); }
function add(t) {
  const k = key(t);
  if (seen.has(k)) return;       // dedup history vs live overlap
  seen.add(k);
  const el = document.createElement('div');
  el.className = 'msg';
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = (t.from || 'someone') + ':';
  el.appendChild(who);
  el.appendChild(document.createTextNode(t.content || ''));
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function loadHistory() {
  const r = await fetch('/api/messages');
  if (!r.ok) { statusEl.textContent = 'auth failed'; return false; }
  const d = await r.json();
  document.getElementById('room').textContent = 'rozum: ' + (d.room || 'meeting');
  (d.messages || []).forEach(add);
  return true;
}

function connectStream() {
  const ev = new EventSource('/api/stream');
  ev.onopen = () => { statusEl.textContent = 'live'; };
  ev.onmessage = (e) => { try { add(JSON.parse(e.data)); } catch (_) {} };
  ev.onerror = () => { statusEl.textContent = 'reconnecting…'; };  // EventSource auto-retries
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const m = document.getElementById('m');
  const v = m.value.trim();
  if (!v) return;
  m.value = '';
  const r = await fetch('/api/submit', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ content: v }),
  });
  if (!r.ok) { statusEl.textContent = 'send failed'; m.value = v; }
});

loadHistory().then((ok) => { if (ok) connectStream(); });
</script>
</body>
</html>
