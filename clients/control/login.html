<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>rozum · вход</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e14;color:#e6e6e6;font:15px -apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
  .card{background:#151a23;border:1px solid #232a36;border-radius:16px;padding:28px;max-width:380px;width:86%;text-align:center}
  h1{font-size:20px;margin:0 0 6px}
  p{color:#8a93a0;font-size:14px;margin:6px 0 20px}
  button{width:100%;background:#2f6feb;color:#fff;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:600}
  #msg{margin-top:14px;font-size:13px;min-height:18px}
  .err{color:#f0a868}.ok{color:#6ee7a8}
  a{color:#7ab8ff;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 rozum control</h1>
  <p>Вход по Face ID (пасскей) для запуска и управления агентами.</p>
  <button id="go">…</button>
  <div id="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@13.1.0/dist/bundle/index.umd.min.js"></script>
<script>
const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;
const go = document.getElementById('go'), msg = document.getElementById('msg');
const j = (r) => r.json();
function note(t, cls){ msg.textContent = t; msg.className = cls || ''; }
async function post(url, body){ return fetch(url, { method:'POST', credentials:'include',
  headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined }); }

let mode = 'login';
(async () => {
  try {
    const s = await fetch('/control/auth/status', { credentials:'include' }).then(j);
    if (s.authed) { location.href = '/'; return; }
    if (!s.webauthn_ok) { note('WebAuthn не инициализирован на сервере (нужен HTTPS + RP ID).', 'err'); go.disabled = true; return; }
    mode = s.has_credential ? 'login' : 'register';
    go.textContent = mode === 'login' ? '🙂 Войти по Face ID' : '🙂 Создать вход (Face ID)';
  } catch (e) { note('сервер недоступен: ' + e, 'err'); }
})();

go.onclick = async () => {
  go.disabled = true; note('…');
  try {
    if (mode === 'register') {
      const opts = await post('/control/auth/register/begin').then(j);
      const att = await startRegistration({ optionsJSON: opts.publicKey });
      const r = await post('/control/auth/register/finish', att);
      if (!r.ok) throw new Error(await r.text());
      note('Face ID создан — теперь войдите.', 'ok');
      mode = 'login'; go.textContent = '🙂 Войти по Face ID';
    } else {
      const opts = await post('/control/auth/login/begin').then(j);
      const asse = await startAuthentication({ optionsJSON: opts.publicKey });
      const r = await post('/control/auth/login/finish', asse);
      if (!r.ok) throw new Error(await r.text());
      note('вход выполнен ✓', 'ok');
      setTimeout(() => location.href = '/', 400);
    }
  } catch (e) { note('не удалось: ' + (e.message || e), 'err'); }
  go.disabled = false;
};
</script>
</body>
</html>
