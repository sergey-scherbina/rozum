<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>rozum · invite</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(130% 95% at 50% 36%,transparent 50%,rgba(2,3,7,.62) 100%),radial-gradient(135% 85% at 50% -12%,#163a50 0%,#0b1d2c 32%,#06090f 68%,#05070c 100%) fixed;color:#e6e6e6;font:15px -apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.card{background:#0d1420;border:1px solid #232a36;border-radius:16px;padding:28px;max-width:400px;width:90%;text-align:center}
h1{font-size:20px;margin:0 0 6px}
p{color:#8a93a0;font-size:14px;margin:6px 0}
.role-box{background:#131c2b;border:1px solid #2a3547;border-radius:10px;padding:14px;margin:16px 0;text-align:left}
.role-name{font-size:16px;font-weight:600;color:#79c0ff;margin-bottom:8px}
.perms{display:flex;flex-wrap:wrap;gap:6px}
.perm{background:#1a2942;color:#58a6ff;border-radius:6px;padding:3px 9px;font-size:12px}
input{width:100%;box-sizing:border-box;background:#131c2b;border:1px solid #2a3547;border-radius:10px;color:#e6e6e6;font-size:16px;padding:12px 14px;margin:10px 0;outline:none}
input:focus{border-color:#4f8ef7}
button{width:100%;background:#4f8ef7;color:#fff;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
button:disabled{opacity:.5}
#msg{margin-top:14px;font-size:13px;min-height:18px}
.err{color:#f0a868}.ok{color:#6ee7a8}
a{color:#7ab8ff;text-decoration:none;font-size:13px}
</style>
</head><body>
<div class="card">
  <h1>🔐 rozum control</h1>
  <p id="subtitle">Checking invite…</p>
  <div id="role-box" class="role-box" style="display:none">
    <div class="role-name" id="role-name"></div>
    <div class="perms" id="perms"></div>
  </div>
  <div id="form" style="display:none">
    <input id="dname" type="text" placeholder="Your name" autocomplete="name" maxlength="60">
    <button id="go">🙂 Register with Face ID</button>
  </div>
  <div id="msg"></div>
  <p style="margin-top:20px"><a href="/login.html">← sign in with existing key</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@13.1.0/dist/bundle/index.umd.min.js"></script>
<script>
const { startRegistration } = SimpleWebAuthnBrowser;
const token = new URLSearchParams(location.search).get('t') || '';
const go = document.getElementById('go');
const msg = document.getElementById('msg');
function note(t, cls){ msg.textContent = t; msg.className = cls || ''; }

async function post(url, body){
  return fetch(url, { method:'POST', credentials:'include',
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined });
}

let inviteInfo = null;
(async () => {
  if (!token) { note('Invite link is invalid (no token).', 'err'); return; }
  try {
    const r = await fetch('/control/invite/info?token=' + encodeURIComponent(token), { credentials:'include' });
    if (!r.ok) { const e = await r.json().catch(() => ({})); note('Invite is invalid: ' + (e.error||r.status), 'err'); return; }
    inviteInfo = await r.json();
    document.getElementById('subtitle').textContent = 'Invite from ' + (inviteInfo.label || 'admin');
    document.getElementById('role-name').textContent = inviteInfo.role_name;
    const permsEl = document.getElementById('perms');
    (inviteInfo.permissions || []).forEach(p => {
      const el = document.createElement('span'); el.className = 'perm'; el.textContent = p; permsEl.appendChild(el);
    });
    document.getElementById('role-box').style.display = '';
    document.getElementById('form').style.display = '';
    if (inviteInfo.uses_remaining != null) {
      note('Uses remaining: ' + inviteInfo.uses_remaining, '');
    }
  } catch(e) { note('Network error: ' + e.message, 'err'); }
})();

go.onclick = async () => {
  const dname = document.getElementById('dname').value.trim();
  if (!dname) { note('Enter your name.', 'err'); return; }
  go.disabled = true; note('…');
  try {
    const opts = await post('/control/auth/register/begin', { invite: token, display_name: dname }).then(r => r.json());
    if (opts.error) throw new Error(opts.error);
    const att = await startRegistration({ optionsJSON: opts.publicKey });
    const r = await post('/control/auth/register/finish', att);
    if (!r.ok) throw new Error(await r.text());
    note('Done! Signing in…', 'ok');
    // Auto-login
    setTimeout(async () => {
      try {
        const lo = await post('/control/auth/login/begin').then(r => r.json());
        const asse = await (await import('https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@13.1.0/dist/bundle/index.umd.min.js')).startAuthentication({ optionsJSON: lo.publicKey }).catch(() => null);
        if (asse) {
          const lr = await post('/control/auth/login/finish', asse);
          if (lr.ok) { location.href = '/'; return; }
        }
      } catch(_){}
      location.href = '/login.html';
    }, 600);
  } catch(e) { note('Error: ' + (e.message || e), 'err'); go.disabled = false; }
};
</script>
</body></html>
