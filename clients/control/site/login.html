<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>rozum · login</title><style>html,body{margin:0;height:100%;background:radial-gradient(130% 95% at 50% 36%,transparent 50%,rgba(2,3,7,.62) 100%),radial-gradient(135% 85% at 50% -12%,#163a50 0%,#0b1d2c 32%,#06090f 68%,#05070c 100%),radial-gradient(58% 48% at 16% 6%,rgba(44,84,120,.34),transparent 62%),radial-gradient(52% 44% at 88% 20%,rgba(74,46,104,.26),transparent 60%) fixed;color:#e6e6e6;font:15px -apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}.card{background:#0d1420;border:1px solid #232a36;border-radius:16px;padding:28px;max-width:380px;width:86%;text-align:center}h1{font-size:20px;margin:0 0 6px}p{color:#8a93a0;font-size:14px;margin:6px 0 20px}button{width:100%;background:#4f8ef7;color:#fff;border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:600}#msg{margin-top:14px;font-size:13px;min-height:18px}.err{color:#f0a868}.ok{color:#6ee7a8}a{color:#7ab8ff;text-decoration:none;font-size:13px}#rozum-lang{position:fixed;bottom:16px;right:16px;display:flex;gap:1px;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,.5)}.rl-btn{background:#21262d;color:#6e7681;border:1px solid #30363d;padding:4px 8px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.03em}.rl-btn:first-child{border-radius:5px 0 0 5px}.rl-btn:last-child{border-radius:0 5px 5px 0}.rl-btn.active{background:#1f3a28;border-color:#2ea043;color:#56d364}</style></head><body><div class="card"><h1>🔐 rozum control</h1><p data-i18n="Sign in with Face ID (passkey) to manage agents.">Sign in with Face ID (passkey) to manage agents.</p><button id="go">…</button><div id="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@13.1.0/dist/bundle/index.umd.min.js"></script><script>
// i18n
var _LG=localStorage.getItem('rozum_lang')||navigator.language.split('-')[0]||'en';
var _LT={'ru':{'Sign in with Face ID':'Войти по Face ID','Register Face ID':'Создать вход (Face ID)','WebAuthn not initialized (HTTPS + RP ID required).':'WebAuthn не инициализирован (нужен HTTPS + RP ID).','Invitation link required — see server log (bootstrap token) or admin invite link.':'Нужна ссылка с токеном — см. лог сервера (bootstrap token) или приглашение.','Face ID created — now sign in.':'Face ID создан — войдите.','signed in ✓':'вход выполнен ✓','failed: ':'не удалось: ','server unavailable: ':'сервер недоступен: ','Sign in with Face ID (passkey) to manage agents.':'Вход по Face ID (пасскей) для управления агентами.'},'uk':{'Sign in with Face ID':'Увійти через Face ID','Register Face ID':'Зареєструвати Face ID','WebAuthn not initialized (HTTPS + RP ID required).':'WebAuthn не ініціалізовано (потрібен HTTPS + RP ID).','Invitation link required — see server log (bootstrap token) or admin invite link.':'Потрібне посилання з токеном — перегляньте лог сервера або запросіть адміністратора.','Face ID created — now sign in.':'Face ID створено — увійдіть.','signed in ✓':'вхід виконано ✓','failed: ':'не вдалося: ','server unavailable: ':'сервер недоступний: ','Sign in with Face ID (passkey) to manage agents.':'Вхід через Face ID (ключ) для керування агентами.'}};
function _lt(s){var m=_LT[_LG];return(m&&m[s])||s;}
function _lApply(){var m=_LT[_LG];if(!m)return;document.querySelectorAll('[data-i18n]').forEach(function(e){e.textContent=_lt(e.dataset.i18n);});document.querySelectorAll('.rl-btn').forEach(function(b){b.classList.toggle('active',b.dataset.lang===_LG);});document.documentElement.lang=_LG;}
function _lSet(l){localStorage.setItem('rozum_lang',l);_LG=_LT[l]?l:'en';_lApply();}
document.documentElement.lang=_LG;
(function(){var d=document.createElement('div');d.id='rozum-lang';['en','ru','uk'].forEach(function(l){var b=document.createElement('button');b.className='rl-btn';b.textContent=l.toUpperCase();b.dataset.lang=l;b.onclick=function(){_lSet(l);};if(l===_LG)b.classList.add('active');d.appendChild(b);});document.body.appendChild(d);_lApply();})();
const { startRegistration, startAuthentication } = SimpleWebAuthnBrowser;
const go = document.getElementById('go'), msg = document.getElementById('msg');
const j = (r) => r.json();
function note(t, cls){ msg.textContent = t; msg.className = cls || ''; }
async function post(url, body){ return fetch(url, { method:'POST', credentials:'include',
  headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined }); }
// ?token=… carries either the one-shot first-registration bootstrap token (ucc-tofu-bootstrap-token)
// or an admin-issued invite token — both are the same `invite` field server-side.
const inviteToken = new URLSearchParams(location.search).get('token') || undefined;
let mode = 'login';
(async () => {
  try {
    const s = await fetch('/control/auth/status', { credentials:'include' }).then(j);
    if (s.authed) { location.href = '/'; return; }
    if (!s.webauthn_ok) { note(_lt('WebAuthn not initialized (HTTPS + RP ID required).'), 'err'); go.disabled = true; return; }
    mode = s.has_credential ? 'login' : 'register';
    if (mode === 'register' && !inviteToken) { note(_lt('Invitation link required — see server log (bootstrap token) or admin invite link.'), 'err'); }
    go.textContent = _lt(mode === 'login' ? 'Sign in with Face ID' : 'Register Face ID');
  } catch (e) { note(_lt('server unavailable: ') + e, 'err'); }
})();
go.onclick = async () => {
  go.disabled = true; note('…');
  try {
    if (mode === 'register') {
      const opts = await post('/control/auth/register/begin', inviteToken ? { invite: inviteToken } : undefined).then(j);
      const att = await startRegistration({ optionsJSON: opts.publicKey });
      const r = await post('/control/auth/register/finish', att);
      if (!r.ok) throw new Error(await r.text());
      note(_lt('Face ID created — now sign in.'), 'ok');
      mode = 'login'; go.textContent = _lt('Sign in with Face ID');
    } else {
      const opts = await post('/control/auth/login/begin').then(j);
      const asse = await startAuthentication({ optionsJSON: opts.publicKey });
      const r = await post('/control/auth/login/finish', asse);
      if (!r.ok) throw new Error(await r.text());
      note(_lt('signed in ✓'), 'ok');
      setTimeout(() => location.href = '/', 400);
    }
  } catch (e) { note(_lt('failed: ') + (e.message || e), 'err'); }
  go.disabled = false;
};
</script></body></html>
