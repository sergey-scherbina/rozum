<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>rozum · терминал</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  html,body{margin:0;height:100%;background:#0b0e14;color:#e6e6e6;font:14px -apple-system,system-ui,sans-serif}
  #bar{display:flex;gap:10px;align-items:center;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#151a23;border-bottom:1px solid #232a36}
  #bar a{color:#7ab8ff;text-decoration:none}
  #st{margin-left:auto;font-size:12px;color:#8a93a0}
  #term{height:calc(100% - 38px);padding:4px}
</style>
</head>
<body>
<div id="bar"><a href="/">← UCC</a><b id="sid"></b><span id="st">…</span></div>
<div id="term"></div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id') || '';
document.getElementById('sid').textContent = id;
const st = document.getElementById('st');
const term = new Terminal({ cursorBlink:true, fontSize:13, theme:{ background:'#0b0e14' } });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();

// control-serve WS lives on :8448 (Tailscale control-API); the session cookie is host-scoped so it rides the upgrade.
const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.hostname + ':8448/control/session/attach/' + encodeURIComponent(id);
let ws;
function connect(){
  st.textContent = 'подключение…';
  ws = new WebSocket(wsUrl);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { st.textContent = '● подключено'; sendResize(); term.focus(); };
  ws.onmessage = (e) => { term.write(typeof e.data === 'string' ? e.data : new Uint8Array(e.data)); };
  ws.onclose = () => { st.textContent = '○ отключено — переподключиться?'; };
  ws.onerror = () => { st.textContent = '✗ ошибка (нужен вход по Face ID?)'; };
}
function sendResize(){ if (ws && ws.readyState === 1) ws.send(JSON.stringify({ resize:{ cols: term.cols, rows: term.rows } })); }
term.onData(d => { if (ws && ws.readyState === 1) ws.send(d); });
window.addEventListener('resize', () => { fit.fit(); sendResize(); });
st.onclick = () => { if (!ws || ws.readyState > 1) connect(); };
connect();
</script>
</body>
</html>
