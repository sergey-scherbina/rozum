[workspace]
members = ["crates/*"]

[package]
name = "rozum"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The engine-linking binary is `rozum-gateway` (binary split, docs/specs/binary-split.md): the
# full CLI + model engines. The thin `rozum` dispatcher lives in `crates/rozum-cli` and forwards
# to this (and to `rozum-meet` for the engine-free MCP hot path). The lib crate stays named
# `rozum` so `rozum::…` paths (lib, tests/mlx_evals.rs) resolve unchanged.
[[bin]]
name = "rozum-gateway"
path = "src/main.rs"

[features]
# Default = the native in-process MLX runtime (primary backend) plus every
# ported model family. GGUF/llama.cpp is deliberately opt-in (`--features gguf`), so
# the shipped default avoids the separate CMake/llama.cpp build while Qwen/MLX works
# out of the box. The first MLX build is still heavy because mlx-sys compiles MLX C++.
# Use `--no-default-features` for the engine-free durable host, `--features gguf` for
# local GGUF/lmstudio/ollama assets, or `--features mistralrs` for the candle backend.
#
# PORTABLE / non-Mac build: `cargo build --workspace --no-default-features --bins`
# builds the durable workspace without a native model toolchain. CI enforces that
# whole-workspace build + library-test contract on Linux; Windows separately gates
# an explicit portable-package allow-list while its daemon/control seams remain Unix-only.
# The native MLX/GGUF backends are Apple-Metal-bound (mlx-sys + llama-cpp-2 `metal`);
# a true gguf-on-Linux (CPU/CUDA, non-metal) is the open `portability-cuda-gguf`.
# `all-models` sits in DEFAULT rather than inside `mlx-native` so that the two are independently
# selectable: a plain `cargo build` loads every architecture exactly as it always has, while a lean
# build keeps the native runtime and drops only the families it never loads:
#   cargo build --no-default-features --features mlx-native                  # qwen core only
#   cargo build --no-default-features --features mlx-native,all-models       # same as default
#   cargo build --no-default-features --features mlx-native,rozum-mlx/model-glm4
# (Folding all-models INTO mlx-native would make the lean build unreachable — mlx-native would drag
# every family back in — and dropping mlx-native to get lean would compile the runtime itself out.)
default = ["mlx-native", "all-models", "ucc"]
local-models = ["rozum-core/local-models"]
# Every ported architecture. Opt-OUT only: this changes nothing about what rozum ships by default.
all-models = ["rozum-mlx/all-models"]
# The browser console (Face ID, RBAC, the SPA routes). Default ON — this machine runs it — but a
# model server does not need a passkey stack, and on Windows it is the difference between a build
# and an OpenSSL hunt (`docs/specs/ucc-optional.md`).
ucc = ["rozum-gateway/ucc"]
gguf = ["rozum-gguf/gguf"]
# The non-Mac GPU paths, forwarded so a CUDA/Vulkan/ROCm user never edits a Cargo.toml
# (`docs/specs/gguf-portability.md`).
gguf-cuda = ["rozum-gguf/gguf-cuda"]
gguf-vulkan = ["rozum-gguf/gguf-vulkan"]
gguf-rocm = ["rozum-gguf/gguf-rocm"]
mistralrs = ["rozum-mistralrs/mistralrs"]
# Native MLX runtime (no Python, no subprocess). Builds MLX C++ from source via
# the vendored fork, so it needs the Metal toolchain. It is in the default feature
# set; that shipped default build contract is macOS-only. See docs/specs/mlx-native-runtime.md.
# The RUNTIME only — the families come from `all-models` / `rozum-mlx/model-*` (see `default`).
mlx-native = ["rozum-mlx/mlx-native"]
# x86-native: the cross-vendor Vulkan iGPU engine (docs/specs/x86-native-runtime.md).
# RESERVED for the real engine's deps (a Vulkan binding + SPIR-V toolchain) once P0 picks
# them. The engine SLOT (`src/x86/`: the `LocalEngine`/`ChatBackend` contract + the
# device/memory/tensor/kernels/model component stubs) compiles WITHOUT this feature, so the
# default CI keeps the seam honest; filling the slot adds `dep:ash`/etc. here and replaces the
# `todo!()` bodies — no structural rework.
x86-native = ["rozum-x86/x86-native"]

[dependencies]
# The meeting room + its client frontends, extracted into their own crate
# (Phase 1 of the workspace split, docs/specs/workspace-split.md). The `rozum`
# crate re-exports its modules under their original paths in src/lib.rs.
rozum-meeting = { path = "crates/rozum-meeting" }
# The durable SPI core (backend/concurrency/obs/engine/serving/sampler/constrain/
# harmony). Phase 0 of the workspace split; the `rozum` crate re-exports its
# modules under their original paths in src/lib.rs. `local-models` forwards here.
rozum-core = { path = "crates/rozum-core" }
# Model catalog / sourcing / residency (Phase 2). Pure leaf; re-exported under
# its original module paths in src/lib.rs.
rozum-models = { path = "crates/rozum-models" }
# The intelligence layer (agent/cascade/router/rag/tools). Phase 3; depends on no
# engine crate. Re-exported under its original module paths in src/lib.rs.
rozum-agent = { path = "crates/rozum-agent" }
# The outward serving layer (OpenAI/Anthropic gateway + HTTP provider shims).
# Phase 3; reads engine telemetry via rozum-core::obs, no engine dep. Re-exported
# under its original module paths in src/lib.rs.
rozum-gateway = { path = "crates/rozum-gateway" }
# Engine crates (Phase 2). Each is always linked, but its heavy backend dep is
# gated behind the crate's own feature, which the binary's feature forwards to.
rozum-mistralrs = { path = "crates/rozum-mistralrs" }
rozum-x86 = { path = "crates/rozum-x86" }
rozum-gguf = { path = "crates/rozum-gguf" }
# The native MLX runtime + speculative decoding (mlx_native_backend/specdecode).
# The vendored mlx-rs fork deps live in the crate, gated behind its `mlx-native`
# feature, which the binary forwards to. See docs/specs/mlx-native-runtime.md.
rozum-mlx = { path = "crates/rozum-mlx" }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
futures = "0.3"
tokio-stream = "0.1"
rmcp = { version = "1.7", features = ["server", "client", "transport-io", "transport-child-process"] }
schemars = "1.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tempfile = "3"
# rustls, NOT the default native-tls: on macOS native-tls is Security.framework and costs nothing,
# but on Linux and Windows it is OpenSSL — a SYSTEM library that must be found, and the reason a
# Linux `cargo check` of this workspace died in `openssl-sys`' build script before compiling a line
# of our code. rustls is vendored Rust; the same command now needs nothing installed
# (`docs/specs/linux-rustls.md`).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Patched mistralrs (Qwen3.6 RMSNorm/AFQ + Metal chunked prefill) until it lands
# upstream. Pinned to a fork rev so a clean clone builds reproducibly without the
# local `.vendor` worktree (which is gitignored). The crate is 0.8.3, satisfying the
# `^0.8.1` requirement above. To iterate on the vendor locally, temporarily swap this
# for `{ path = ".vendor/mistral-rs-chunked/mistralrs" }`, then push + bump the rev.
# See patches/README.md and docs/specs/mistralrs-chunked-prefill.md.
[patch.crates-io]
mistralrs = { git = "https://github.com/sergey-scherbina/mistral.rs.git", rev = "6e98a45e23a834543c9ae611d579818b343a24f0" }
