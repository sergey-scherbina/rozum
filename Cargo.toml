[package]
name = "rozum"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
local-models = ["dep:candle", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
candle = { package = "candle-core", version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.22.0", features = ["onig"], optional = true }

tokio = { version = "1", features = ["full"] }
rmcp = { version = "1.7", features = ["server", "client", "transport-io"] }
schemars = "1.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
