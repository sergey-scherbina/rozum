[package]
name = "rozum"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
# mistralrs is on by default so `cargo build` produces a binary that can run
# local MLX models out of the box on Apple Silicon. Override with
# `cargo build --no-default-features` if you only need the meeting-room
# runtime and want to skip the Metal Toolchain requirement.
default = ["mistralrs"]
local-models = ["dep:candle", "dep:candle-transformers", "dep:tokenizers"]
gguf = ["dep:llama-cpp-2"]
mistralrs = ["dep:mistralrs"]

[dependencies]
candle = { package = "candle-core", version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.22.0", features = ["onig"], optional = true }
llama-cpp-2 = { version = ">=0.1.100", features = ["metal"], optional = true }
mistralrs = { version = "0.8.1", features = ["metal"], optional = true }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
futures = "0.3"
tokio-stream = "0.1"
rmcp = { version = "1.7", features = ["server", "client", "transport-io"] }
schemars = "1.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Use the patched vendored mistralrs (`.vendor/mistral-rs`) until the Qwen3.6
# RMSNorm fix and MLX-AFQ support land upstream. The vendored crate is 0.8.3,
# which satisfies the `^0.8.1` requirement above, so cargo transparently swaps
# the registry build for the local one. See patches/README.md and
# docs/specs/mlx-weight-layout-and-afq.md section 13.
[patch.crates-io]
mistralrs = { path = ".vendor/mistral-rs-chunked/mistralrs" }
