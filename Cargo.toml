[package]
name = "rozum"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
# Default = the pure-Rust native MLX runtime (primary in-process backend) PLUS the
# GGUF backend (the fallback for GGUF/llama.cpp files, tried after native MLX), so
# `cargo build` runs the Qwen3 / Qwen3.6 family out of the box AND opens local
# `.gguf` / `lmstudio:` / `ollama:` models. Heavy first build: mlx-sys compiles
# MLX C++ and llama-cpp-2 compiles llama.cpp (cmake + full Xcode). Use
# `--no-default-features` for just the meeting-room runtime (no Metal toolchain),
# or `--features mistralrs` for the broader-catalog candle backend.
default = ["mlx-native", "gguf"]
local-models = ["dep:candle", "dep:candle-transformers", "dep:tokenizers"]
gguf = ["dep:llama-cpp-2"]
mistralrs = ["dep:mistralrs"]
# Pure-Rust native MLX runtime (no Python, no subprocess). Builds MLX C++ from
# source via the vendored fork, so it needs the Metal toolchain and is off by
# default. See docs/specs/mlx-native-runtime.md.
mlx-native = ["dep:mlx-rs", "dep:mlx-lm", "dep:mlx-lm-utils"]

[dependencies]
candle = { package = "candle-core", version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.22.0", features = ["onig"], optional = true }
llama-cpp-2 = { version = ">=0.1.100", features = ["metal"], optional = true }
mistralrs = { version = "0.8.1", features = ["metal"], optional = true }

# Native MLX runtime: the vendored fork of oxideai/mlx-rs (the `mlx-lm` Rust
# crates). Pinned to a fork rev so a clean clone builds reproducibly without the
# local `.vendor` worktree (gitignored), exactly like the mistralrs
# [patch.crates-io] below. To iterate locally, temporarily swap these for
# `{ path = "../../.vendor/mlx-lm/<crate>" }` (from a worktree) or
# `{ path = ".vendor/mlx-lm/<crate>" }` (from the repo root), then push the fork
# and bump the rev. mlx-sys builds MLX C++ from source (cmake + Xcode).
mlx-rs = { git = "https://github.com/sergey-scherbina/mlx-rs.git", rev = "4fa79112682c99da2218e733249a455c76c17baa", optional = true }
mlx-lm = { git = "https://github.com/sergey-scherbina/mlx-rs.git", rev = "4fa79112682c99da2218e733249a455c76c17baa", optional = true }
mlx-lm-utils = { git = "https://github.com/sergey-scherbina/mlx-rs.git", rev = "4fa79112682c99da2218e733249a455c76c17baa", optional = true }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
futures = "0.3"
tokio-stream = "0.1"
rmcp = { version = "1.7", features = ["server", "client", "transport-io"] }
schemars = "1.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Patched mistralrs (Qwen3.6 RMSNorm/AFQ + Metal chunked prefill) until it lands
# upstream. Pinned to a fork rev so a clean clone builds reproducibly without the
# local `.vendor` worktree (which is gitignored). The crate is 0.8.3, satisfying the
# `^0.8.1` requirement above. To iterate on the vendor locally, temporarily swap this
# for `{ path = ".vendor/mistral-rs-chunked/mistralrs" }`, then push + bump the rev.
# See patches/README.md and docs/specs/mistralrs-chunked-prefill.md.
[patch.crates-io]
mistralrs = { git = "https://github.com/sergey-scherbina/mistral.rs.git", rev = "6e98a45e23a834543c9ae611d579818b343a24f0" }
