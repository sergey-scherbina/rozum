[package]
name = "rozum-gguf"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The in-process GGUF / llama.cpp engine (`GgufBackend`, via llama-cpp-2 + Metal).
# The always-compiled parts (chat-template formatting, spec/path resolution,
# `register_engine`) build without the feature; the heavy `llama-cpp-2` dep and
# `GgufBackend` are gated behind this crate's `gguf` feature, which the binary
# forwards to. The engine registers itself with rozum-core's backend registry via
# `register_engine()` (inversion of control). Phase 2 of the workspace split.

[features]
# `gguf` alone = the portable build: llama.cpp on CPU, everywhere. A GPU backend is a SEPARATE
# feature, because which one exists is a property of the machine, not of this crate.
gguf = ["dep:llama-cpp-2"]
# Non-Mac GPU paths, passed straight through to llama-cpp-2. Before these, `--features gguf`
# hardcoded `metal` — so a Linux or Windows user asking for GGUF got an Apple-only build and had to
# edit this file to get their own GPU. The point of the engine was that it runs on other people's
# hardware; it could not.
gguf-cuda = ["gguf", "llama-cpp-2/cuda"]
gguf-vulkan = ["gguf", "llama-cpp-2/vulkan"]
gguf-rocm = ["gguf", "llama-cpp-2/rocm"]

[dependencies]
# Where this user keeps files — one rule for the workspace (docs/specs/windows-user-paths.md).
rozum-paths = { path = "../rozum-paths" }
rozum-core = { path = "../rozum-core" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
async-trait = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tracing = "0.1"
llama-cpp-2 = { version = ">=0.1.100", optional = true }

# Metal is added HERE rather than in the feature above, so it follows the TARGET instead of the
# request: a Mac build still gets the GPU with a plain `--features gguf`, and the same command on
# Linux no longer asks for an Apple backend. Cargo unions the features of both entries for the same
# optional dependency, so this adds `metal` without a second dependency edge.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = ">=0.1.100", features = ["metal"], optional = true }
