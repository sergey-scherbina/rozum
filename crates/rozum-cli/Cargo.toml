[package]
name = "rozum-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The thin `rozum` umbrella dispatcher (binary split, docs/specs/binary-split.md). Pure std, NO
# dependencies — it only inspects argv[1] and forwards to the right backend binary (`exec` on Unix,
# spawn/wait with exit-code propagation on Windows), so it builds in well under a second and a
# frontend fix never drags the engine rebuild. Routes the engine-free
# MCP hot path to `rozum-meet`; everything else to `rozum-gateway` (the full engine-linking CLI).

[[bin]]
name = "rozum"
path = "src/main.rs"

# The ONE dependency, and it is dependency-free itself: the build stamp that lets
# `doctor --services` say what is deployed (docs/specs/deployment-drift.md). Without it this
# binary is permanently "age unknown", which is a warning nobody can clear.
[dependencies]
rozum-stamp = { path = "../rozum-stamp" }
