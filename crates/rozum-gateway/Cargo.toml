[package]
name = "rozum-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The outward-facing serving layer: the OpenAI/Anthropic-compatible HTTP gateway
# (`gateway`) plus the upstream HTTP provider shims (`openai_http`, `anthropic_http`).
# Builds on the rozum-core SPI + rozum-models catalog; reads engine telemetry through
# rozum-core::obs (no dependency on any concrete engine). Phase 3 of the workspace
# split (docs/specs/workspace-split.md).

[dependencies]
rozum-core = { path = "../rozum-core" }
rozum-models = { path = "../rozum-models" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
