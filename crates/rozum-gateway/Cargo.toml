[package]
name = "rozum-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The outward-facing serving layer: the OpenAI/Anthropic-compatible HTTP gateway
# (`gateway`) plus the upstream HTTP provider shims (`openai_http`, `anthropic_http`).
# Builds on the rozum-core SPI + rozum-models catalog; reads engine telemetry through
# rozum-core::obs (no dependency on any concrete engine). Phase 3 of the workspace
# split (docs/specs/workspace-split.md).

[features]
ucc = ["dep:webauthn-rs"]

[dependencies]
base64 = "0.22"
rozum-core = { path = "../rozum-core" }
rozum-models = { path = "../rozum-models" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# rustls, NOT the default native-tls: on macOS native-tls is Security.framework and costs nothing,
# but on Linux and Windows it is OpenSSL — a SYSTEM library that must be found, and the reason a
# Linux `cargo check` of this workspace died in `openssl-sys`' build script before compiling a line
# of our code. rustls is vendored Rust; the same command now needs nothing installed
# (`docs/specs/linux-rustls.md`).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
axum = { version = "0.8", features = ["ws"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
libc = "0.2"
# Phase 4 — live terminal sessions + Face ID auth (UCC).
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"], optional = true }
portable-pty = "0.8"
url = "2"
