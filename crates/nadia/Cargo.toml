[package]
name = "nadia"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# nadia — the coding agent as an application. It is a thin leaf: the loop, tool
# dispatch and budgets come from `rozum-agent` (Contract 2/3 of
# docs/specs/integration.md), the model connection from `rozum-gateway`'s
# OpenAI-compatible client backend, and the per-family tool rendering/parsing stays
# where it belongs — in the gateway. What lives here is what an application owns:
# six tools, the sandbox they run in, the prompts, and two front-ends (a headless
# batch CLI that drops into scripts/bench/agentic.sh, and an interactive REPL).
#
# Twin of the ScalaScript implementation in the `nadia` repo (REPOS.md): same spec,
# same tool set, same safety model — this one is the executable reference, that one
# dogfoods the language. Divergence between them is a bug in one of them.

[[bin]]
name = "nadia"
path = "src/main.rs"

[dependencies]
rozum-agent = { path = "../rozum-agent" }
rozum-core = { path = "../rozum-core" }
rozum-gateway = { path = "../rozum-gateway" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
