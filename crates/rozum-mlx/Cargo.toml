[package]
name = "rozum-mlx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The pure-Rust native MLX runtime (the primary in-process Apple-Metal engine) plus
# speculative decoding (`specdecode` / `specdecode_backend`). The heavy MLX deps
# (the vendored oxideai/mlx-rs fork: mlx-rs/mlx-lm/mlx-lm-utils, which build MLX C++
# from source) are gated behind this crate's `mlx-native` feature, which the binary
# forwards to. Phase 2 of the workspace split (docs/specs/workspace-split.md).
# See docs/specs/mlx-native-runtime.md.

[features]
# `mlx-native` pulls the runtime + the qwen3/qwen3_5 CORE (which mlx-lm always compiles — the
# families below are what's optional). It deliberately does NOT imply `all-models`: the binary's
# own `mlx-native` does that, so a plain `cargo build` keeps loading every family exactly as
# before, while a lean consumer can take `rozum-mlx/mlx-native` + only the families it loads.
mlx-native = ["dep:mlx-rs", "dep:mlx-lm", "dep:mlx-lm-utils", "dep:image"]

# Per-family model support. Each forwards to the fork's matching feature (so the ARCHITECTURE
# code isn't compiled) and gates rozum's own loader arm + `LoadedModel` variant + parser.
# `mlx-lm?/x` = "only if mlx-lm is already enabled" — these are inert without `mlx-native`.
all-models = [
    "model-deepseek-v2",
    "model-gemma3",
    "model-glm4",
    "model-glm4-moe-lite",
    "model-gpt-oss",
    "model-llama",
    "model-qwen2",
    "model-qwen3-moe",
    "model-qwen3-5-moe",
]
model-deepseek-v2 = ["mlx-lm?/deepseek-v2"]
model-gemma3 = ["mlx-lm?/gemma3"]
model-glm4 = ["mlx-lm?/glm4"]
model-glm4-moe-lite = ["mlx-lm?/glm4-moe-lite"]
model-gpt-oss = ["mlx-lm?/gpt-oss"]
model-llama = ["mlx-lm?/llama"]
model-qwen2 = ["mlx-lm?/qwen2"]
model-qwen3-moe = ["mlx-lm?/qwen3-moe"]
# Mirrors the fork's edge: qwen3_5_moe reuses qwen3_moe's blocks.
model-qwen3-5-moe = ["mlx-lm?/qwen3-5-moe", "model-qwen3-moe"]

[dependencies]
rozum-core = { path = "../rozum-core" }
rozum-models = { path = "../rozum-models" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"

# The vendored MLX fork, pinned to a fork rev so a clean clone builds reproducibly
# (same pin as the old root Cargo.toml). mlx-sys builds MLX C++ from source.
mlx-rs = { git = "https://github.com/sergey-scherbina/mlx-rs.git", rev = "2df597b731b7c8b6f60c840ea6fcb63f33d663e4", optional = true }
# default-features = false: the fork's `all-models` default would compile every architecture back
# in regardless of the family features above, defeating the whole point. The families are opted
# into explicitly by `all-models` / `model-*`; the qwen core is ungated in the fork, so a
# no-family build still loads Qwen.
mlx-lm = { git = "https://github.com/sergey-scherbina/mlx-rs.git", rev = "2df597b731b7c8b6f60c840ea6fcb63f33d663e4", optional = true, default-features = false }
mlx-lm-utils = { git = "https://github.com/sergey-scherbina/mlx-rs.git", rev = "2df597b731b7c8b6f60c840ea6fcb63f33d663e4", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

[dev-dependencies]
# For the prompt-lookup accept-rate measurement (`specdecode_plookup` ignored test):
# loads a real model tokenizer to measure token-level acceptance on a real code edit.
# Dev-only + pure Rust, so it does NOT pull the MLX C++ and the default build is untouched.
tokenizers = "0.22"
