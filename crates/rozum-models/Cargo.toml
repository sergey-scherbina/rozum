[package]
name = "rozum-models"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Model catalog + sourcing + residency: the model registry (`models`), source
# resolvers (`model_source`, `hf_hub`, `modelscope`) and on-disk residency
# (`resident`). A pure leaf — no dependency on the SPI core or any engine; the
# engines (rozum-mlx/-gguf/…) and the binary depend on it. Phase 2 of the
# workspace split (docs/specs/workspace-split.md).

[dependencies]
# Where this user keeps files — one rule for the workspace (docs/specs/windows-user-paths.md).
rozum-paths = { path = "../rozum-paths" }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# rustls, NOT the default native-tls: on macOS native-tls is Security.framework and costs nothing,
# but on Linux and Windows it is OpenSSL — a SYSTEM library that must be found, and the reason a
# Linux `cargo check` of this workspace died in `openssl-sys`' build script before compiling a line
# of our code. rustls is vendored Rust; the same command now needs nothing installed
# (`docs/specs/linux-rustls.md`).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
tempfile = "3"
