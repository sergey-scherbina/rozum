name: ci

# Three gates:
#  - macos: every shipped binary with the default native-MLX feature set + every library test.
#  - linux: the **portable durable core** (`--no-default-features`: no native backends — the SPI,
#    gateway w/ HTTP backends, agent runtime, cascade router, concurrency, config, meeting room).
#    This enforces that the durable layer stays Linux-buildable, the central claim of
#    `docs/specs/portability-and-the-backend-spi.md` — a regression there fails CI, not folklore.
#  - windows: an explicit portable-package allow-list plus the thin dispatcher; known Unix-only
#    daemon/control/service packages stay excluded until their platform seams are ported.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macos — default build + lib tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install stable
      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # `--workspace` is load-bearing: without it cargo tests only the ROOT package, so the other
      # workspace-member suites were never built here. That is exactly how rozum-gateway's 106 tests
      # rotted to 62 compile errors unnoticed (`08c9d9a`) — `cargo check`/`cargo build` skip
      # `#[cfg(test)]` code, so every signal we watched stayed green while 0 tests ran.
      - name: Build every binary (shipped default features)
        run: cargo build --workspace --bins
      - name: Test every workspace library (shipped default features)
        run: cargo test --workspace --lib
      # `--bins` is the same lesson one level up. `--lib` builds and runs library suites only, so
      # every `#[cfg(test)]` inside a BINARY was invisible here — 64 tests across the workspace's
      # bins, including the whole `rozum-gateway` bin suite, ran on nobody's machine but the author's.
      # Verified green across the workspace before this line was added, so it fails on a regression
      # rather than on a backlog.
      - name: Test every workspace binary (shipped default features)
        run: cargo test --workspace --bins
      # The bench harness is shell, so no cargo gate ever saw it — and its structured exit codes are
      # the vocabulary every board entry argues in ("0 rc11", "rc=10 so it is the model"). This runs
      # the classification against real directories, and asserts that the console and both
      # summarizers know every code it can emit. Under a second; needs no model and no gateway.
      - name: Test the bench exit-code classification
        run: bash scripts/bench/test-classify-rc.sh

  linux-core:
    name: linux — portable core (no native backends)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install stable
      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # No Metal/Xcode toolchain on Linux: build every engine-free entrypoint and compile every
      # workspace library's test target. `--workspace` is as load-bearing here as on macOS.
      - name: Build every binary (--no-default-features)
        run: cargo build --workspace --no-default-features --bins
      - name: Test every workspace library (--no-default-features)
        run: cargo test --workspace --no-default-features --lib

  windows-core:
    name: windows — portable core (no native backends)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install stable
      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # Honest Windows scope: these packages contain the portable SPI/model/agent layers and
      # feature-off engine interfaces. The two exclusions the list used to carry are gone —
      # `rozum-meeting`'s unix-domain IPC moved behind `meeting::ipc` (windows-daemon-ipc) and the
      # gateway's signals/spawn behind `procctl` (windows-spawn-seams) — so the whole workspace is
      # checked below instead. The thin dispatcher is portable (spawn+wait on Windows, exec on Unix).
      - name: Build the portable dispatcher
        run: cargo build --no-default-features -p rozum-cli --bin rozum
      - name: Test the declared portable-core packages
        run: >-
          cargo test --no-default-features --lib
          -p rozum-core
          -p rozum-models
          -p rozum-agent
          -p rozum-gguf
          -p rozum-mistralrs
          -p rozum-mlx
          -p rozum-x86
      # The seams are compile-only claims, and a compile-only claim rots silently: one
      # `std::os::unix` added anywhere in the gateway puts it back to where it was in July, and
      # nothing on a mac would notice. This is the guard, and it is the FIRST time these packages
      # are compiled on a real Windows box (MSVC — the local proof was a `x86_64-pc-windows-gnu`
      # cross-check). A red here is that difference reporting itself, not a regression.
      - name: Check the whole workspace still compiles for Windows
        run: cargo check --workspace --no-default-features
